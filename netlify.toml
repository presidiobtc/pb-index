[build]
  command = "python3 scripts/validate_search_corpus.py && python3 scripts/build_search_chunks.py && python3 scripts/build_featured_topics.py"
  publish = "public"
  functions = "netlify/functions"

[functions."ask-api"]
  included_files = ["public/search_chunks.json", "public/search_core.js"]

[functions."mcp"]
  included_files = ["public/search_chunks.json", "public/search_core.js"]

[functions."ask-page"]
  included_files = ["public/ask.html"]

[functions."ask-preview"]
  included_files = [
    "public/logo.png",
    "node_modules/@fontsource/newsreader/files/newsreader-latin-400-normal.woff",
    "node_modules/@fontsource/inter/files/inter-latin-400-normal.woff",
    "node_modules/@fontsource/inter/files/inter-latin-600-normal.woff",
  ]

[functions."refresh-featured"]
  # Run at 14:00 UTC each day so refresh timing is explicit across deployments.
  schedule = "0 14 * * *"

[[redirects]]
  from = "/"
  to = "/ask.html"
  status = 302
  force = true

[[redirects]]
  from = "/topics"
  to = "/topics/index.html"
  status = 200
  force = true

[[redirects]]
  from = "/topics/"
  to = "/topics/index.html"
  status = 200
  force = true

[[redirects]]
  from = "/ask/shared/:id/card.png"
  to = "/.netlify/functions/ask-preview?id=:id"
  status = 200

[[redirects]]
  from = "/ask/shared/:id"
  to = "/.netlify/functions/ask-page?id=:id"
  status = 200

[[redirects]]
  from = "/ask/shared/:id/"
  to = "/.netlify/functions/ask-page?id=:id"
  status = 200

[[redirects]]
  from = "/api/ask"
  to = "/.netlify/functions/ask-api"
  status = 200
