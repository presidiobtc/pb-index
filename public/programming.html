<html lang="en">
<head>
  <meta charset="utf-8" />

  <title>Presidio Bitcoin Media Archive - Programming</title>
  <link rel="icon" href="https://www.presidiobitcoin.org/favicon.png" type="image/png">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --green:      #1f4d2a;
      --green-mid:  #2a6438;
      --green-light:#e8f0ea;
      --text:       #111;
      --muted:      #666;
      --border:     #ddd;
      --bg:         #fff;
    }

    body {
      font-family: Georgia, 'Times New Roman', serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.6;
    }

    /* ── Header ── */
    .site-header { background: var(--green); padding: 0 24px; }
    .header-inner {
      max-width: 960px; margin: 0 auto;
      display: flex; align-items: center; justify-content: space-between;
      height: 52px;
    }
    .site-logo {
      display: flex;
      align-items: center;
      gap: 8px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      font-size: 16px; font-weight: 700; color: #fff;
      text-decoration: none; letter-spacing: -0.2px;
    }
    .site-logo img {
      height: 28px;
      width: 28px;
      object-fit: contain;
      filter: brightness(0) invert(1);
      flex-shrink: 0;
    }
    .site-nav { display: flex; align-items: center; gap: 2px; }
    .nav-link {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      font-size: 13px; font-weight: 500; padding: 5px 10px; border-radius: 5px;
      color: rgba(255,255,255,0.65); text-decoration: none;
      transition: color 0.12s, background 0.12s; white-space: nowrap;
    }
    .nav-link:hover { color: #fff; }
    .nav-link.active { background: rgba(255,255,255,0.12); color: #fff; }
    .nav-sep { width: 1px; height: 18px; background: rgba(255,255,255,0.2); margin: 0 6px; flex-shrink: 0; }
    .icon-link {
      display: flex; align-items: center; justify-content: center;
      color: rgba(255,255,255,0.6); padding: 5px; border-radius: 5px;
      text-decoration: none; transition: color 0.12s, background 0.12s; flex-shrink: 0;
    }
    .icon-link:hover { color: #fff; background: rgba(255,255,255,0.08); }
    .icon-link svg { width: 16px; height: 16px; fill: currentColor; display: block; }
    .ext-link { font-size: 12px; opacity: 0.75; margin-left: 4px; }
    .ext-link:hover { opacity: 1; }

    /* ── Page ── */
    .page-wrap { max-width: 780px; margin: 0 auto; padding: 40px 24px 100px; }

    .page-title { font-size: 28px; font-weight: normal; margin-bottom: 4px; }
    .page-sub {
      font-size: 14px; color: var(--muted); margin-bottom: 40px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    }
    .page-sub a {
      color: var(--green);
      font-weight: 700;
      text-decoration: none;
      border-bottom: 1.5px solid var(--green-light);
    }
    .page-sub a:hover {
      border-bottom-color: var(--green);
    }
    .nowrap { white-space: nowrap; }
    /* ── Event card ── */
    .event-card {
      border: 1.5px solid var(--border);
      border-radius: 10px;
      padding: 28px 32px;
      margin-bottom: 28px;
      scroll-margin-top: 24px;
      display: flex;
      gap: 28px;
      align-items: flex-start;
    }
    .event-card:target {
      border-color: var(--green);
      box-shadow: 0 0 0 3px rgba(31,77,42,0.1);
    }
    .event-image {
      width: 160px;
      flex-shrink: 0;
      height: auto;
      border-radius: 6px;
      display: block;
    }
    .event-body {
      flex: 1;
      min-width: 0;
    }
    @media (max-width: 560px) {
      .event-card { flex-direction: column; }
      .event-image { width: 100%; max-width: 260px; }
    }

    .event-type-row {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 12px;
    }
    .event-type-badge {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      background: var(--green-light);
      color: var(--green);
      padding: 2px 8px;
      border-radius: 999px;
    }
    .event-date {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      font-size: 13px;
      color: var(--muted);
    }

    .event-title-row {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 14px;
    }
    .event-title {
      font-size: 22px;
      font-weight: normal;
      color: var(--text);
      line-height: 1.3;
    }
    .permalink {
      display: flex;
      align-items: center;
      color: var(--muted);
      text-decoration: none;
      opacity: 0;
      transition: opacity 0.12s;
      flex-shrink: 0;
    }
    .permalink svg { width: 16px; height: 16px; }
    .event-card:hover .permalink { opacity: 1; }
    .permalink:hover { color: var(--green); }
    .permalink-copied { color: var(--green) !important; opacity: 1 !important; transition: none; }

    .event-blurb {
      font-size: 15px;
      line-height: 1.75;
      color: #333;
      margin-bottom: 22px;
    }

    /* ── Output links ── */
    .output-links {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }
    .output-link {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      font-size: 13px;
      font-weight: 500;
      color: var(--green);
      background: var(--green-light);
      border: 1.5px solid transparent;
      padding: 6px 14px;
      border-radius: 6px;
      text-decoration: none;
      transition: background 0.12s, border-color 0.12s, color 0.12s;
    }
    .output-link:hover {
      background: var(--green);
      color: #fff;
      border-color: var(--green);
    }
    .output-link svg {
      width: 14px; height: 14px; fill: currentColor; flex-shrink: 0;
    }

    @media (max-width: 600px) {
      .site-header { padding: 0 10px; }
      .icon-link, .nav-sep, .ext-link { display: none; }
      .logo-text { display: none; }
      .site-logo { gap: 0; }
      .nav-link { font-size: 11px; padding: 5px 6px; }
    }

    /* ── Footer ── */
    .site-footer { background: var(--green); padding: 48px 24px; text-align: center; margin-top: 80px; }
    .footer-inner { max-width: 600px; margin: 0 auto; }
    .footer-logo { display: inline-flex; align-items: center; gap: 14px; text-decoration: none; margin-bottom: 20px; }
    .footer-logo img { width: 52px; height: 52px; object-fit: contain; filter: brightness(0) invert(1); }
    .footer-logo-name {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      font-size: 18px; font-weight: 700; letter-spacing: 2.5px; color: #fff; text-transform: uppercase;
    }
    .footer-icons { display: flex; justify-content: center; gap: 6px; margin-bottom: 20px; }
    .footer-icon {
      display: flex; align-items: center; justify-content: center;
      width: 44px; height: 44px; color: rgba(255,255,255,0.7);
      border-radius: 8px; text-decoration: none; transition: color .15s, background .15s;
    }
    .footer-icon:hover { color: #fff; background: rgba(255,255,255,0.1); }
    .footer-icon svg { width: 22px; height: 22px; fill: currentColor; display: block; }
    .footer-copy { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 13px; color: rgba(255,255,255,0.5); line-height: 2; }
    .footer-block-link { color: rgba(255,255,255,0.75); text-decoration: none; }
    .footer-block-link:hover { text-decoration: underline; text-underline-offset: 2px; }
  </style>
</head>

    function esc(s) {
      return String(s ?? "").replace(/[&<>"']/g, c =>
        ({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#039;"}[c]));
    }

    function renderProgramCard(def) {
      const links = def.links.map(link => `
        <a class="output-link" href="${esc(link.url)}" target="_blank" rel="noreferrer">
          ${ICONS[link.kind] || ICONS.web}
          ${esc(link.label)}
        </a>
      `).join("");
      return `
        <div class="event-card" id="${esc(def.eventId)}">
          <img class="event-image" src="${esc(def.image)}" alt="${esc(def.alt)}" style="align-self: center;" />
          <div class="event-body">
            <div class="event-type-row">
              ${def.type ? `<span class="event-type-badge">${esc(def.type)}</span>` : ""}
              ${def.date ? `<span class="event-date">${esc(def.date)}</span>` : ""}
            </div>
            <div class="event-title-row">
              <h2 class="event-title">${esc(def.title)}</h2>
              <a class="permalink" href="#${esc(def.eventId)}" title="Link to this programming">${CHAIN_SVG}</a>
            </div>
            <p class="event-blurb">${esc(def.blurb)}</p>
            <div class="output-links">${links}</div>
          </div>
        </div>`;
    }

    const PROGRAMMING_ORDER = [
      "pbj",
      "21in21",
      "bitcoin-quantum-readiness-report",
      "spotlight",
      "built-in-the-presidio",
    ];
    const SERIES_BY_ID = new Map(SERIES_DEFS.map(def => [def.id, def]));

    function renderProgramming() {
      const cards = PROGRAMMING_ORDER
        .map(id => SERIES_BY_ID.get(id))
        .filter(Boolean)
        .map(renderProgramCard)
        .join("");
      document.querySelector(".page-wrap").innerHTML = `
        <h1 class="page-title">Programming</h1>
        <p class="page-sub">Podcasts, reports, and other media produced at or by Presidio Bitcoin.</p>
        ${cards}
      `;
    }

    renderProgramming();

    document.addEventListener("click", function(e) {
      const link = e.target.closest(".permalink");
      if (!link) return;
      const url = location.origin + location.pathname + link.getAttribute("href");
      navigator.clipboard.writeText(url).catch(() => {});
      link.classList.add("permalink-copied");
      setTimeout(() => link.classList.remove("permalink-copied"), 1500);
    });
  </script>
