<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <base href="../" />
  <title>Presidio Bitcoin Media Archive - Topics</title>
  <link rel="icon" href="https://www.presidiobitcoin.org/favicon.png" type="image/png">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --green:      #1f4d2a;
      --green-mid:  #2a6438;
      --green-light:#e8f0ea;
      --text:       #111;
      --muted:      #666;
      --border:     #ddd;
      --bg:         #fff;
    }

    body {
      font-family: Georgia, 'Times New Roman', serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.6;
    }

    /* ── Header ── */
    .site-header {
      background: var(--green);
      padding: 0 24px;
    }
    .header-inner {
      max-width: 960px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      height: 52px;
    }
    .site-logo {
      display: flex;
      align-items: center;
      gap: 8px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      font-size: 16px;
      font-weight: 700;
      color: #fff;
      text-decoration: none;
      letter-spacing: -0.2px;
    }
    .site-logo img {
      height: 28px;
      width: 28px;
      object-fit: contain;
      filter: brightness(0) invert(1);
      flex-shrink: 0;
    }
    .site-nav { display: flex; align-items: center; gap: 2px; }
    .nav-link {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      font-size: 13px;
      font-weight: 500;
      padding: 5px 10px;
      border-radius: 5px;
      color: rgba(255,255,255,0.65);
      text-decoration: none;
      transition: color 0.12s, background 0.12s;
      white-space: nowrap;
    }
    .nav-link:hover { color: #fff; }
    .nav-link.active {
      background: rgba(255,255,255,0.12);
      color: #fff;
    }
    .nav-sep {
      width: 1px;
      height: 18px;
      background: rgba(255,255,255,0.2);
      margin: 0 6px;
      flex-shrink: 0;
    }
    .icon-link {
      display: flex;
      align-items: center;
      justify-content: center;
      color: rgba(255,255,255,0.6);
      padding: 5px;
      border-radius: 5px;
      text-decoration: none;
      transition: color 0.12s, background 0.12s;
      flex-shrink: 0;
    }
    .icon-link:hover { color: #fff; background: rgba(255,255,255,0.08); }
    .icon-link svg { width: 16px; height: 16px; fill: currentColor; display: block; }
    .ext-link { font-size: 12px; opacity: 0.75; margin-left: 4px; }
    .ext-link:hover { opacity: 1; }

    /* ── Page ── */
    .page-wrap {
      max-width: 780px;
      margin: 0 auto;
      padding: 40px 24px 100px;
    }

    .page-title {
      font-size: 28px;
      font-weight: normal;
      margin-bottom: 4px;
      color: var(--text);
      text-align: center;
    }
    .page-sub {
      font-size: 14px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      color: var(--muted);
      margin-bottom: 20px;
      text-align: center;
    }

    /* ── Featured topics ── */
    .featured-now {
      display: none;
      border-top: 1px solid var(--border);
      border-bottom: 1px solid var(--border);
      padding: 8px 0 9px;
      margin: 0 0 18px;
    }
    .featured-now.visible { display: block; }
    .featured-head {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 3px;
    }
    .featured-title {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--muted);
    }
    .featured-grid {
      display: grid;
      gap: 0;
    }
    .featured-card {
      display: grid;
      grid-template-columns: minmax(150px, 0.32fr) minmax(0, 1fr);
      align-items: baseline;
      gap: 12px;
      padding: 4px 0;
      border: 0;
      border-radius: 0;
      background: transparent;
    }
    .featured-topic {
      color: var(--green);
      font-size: 15px;
      line-height: 1.35;
      text-decoration: none;
      min-width: 0;
    }
    .featured-topic:hover { color: var(--green-mid); }
    .featured-article {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      font-size: 12px;
      line-height: 1.35;
      color: #444;
      text-decoration: none;
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .featured-article:hover { color: var(--green); }
    .featured-empty {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      font-size: 12px;
      color: var(--muted);
    }

    /* ── Quick-jump nav ── */
    .quick-nav {
      padding: 0 0 24px;
      display: flex;
      flex-wrap: wrap;
      gap: 1px;
      justify-content: center;
    }
    .quick-nav-link {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      font-size: 13px;
      font-weight: 500;
      color: var(--green);
      text-decoration: none;
      padding: 3px 8px;
      border-radius: 4px;
      transition: background 0.1s, color 0.1s;
      white-space: nowrap;
    }
    .quick-nav-link:hover { background: var(--green-light); }

    /* ── Letter divider (alpha view) ── */
    .letter-group { margin-bottom: 4px; }
    .letter-heading {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      font-size: 15px;
      font-weight: 700;
      color: var(--green);
      padding: 18px 4px 4px;
      letter-spacing: 0.5px;
    }

    /* ── Topic accordion ── */
    .topic-list {
      border-top: 1px solid var(--border);
    }

    details {
      border-bottom: 1px solid var(--border);
    }

    summary {
      list-style: none;
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 13px 4px;
      cursor: pointer;
      user-select: none;
      font-size: 16px;
      color: var(--green);
      transition: color 0.12s;
    }
    summary::-webkit-details-marker { display: none; }
    summary:hover { color: var(--green-mid); }

    .summary-arrow {
      font-size: 10px;
      color: var(--green);
      flex-shrink: 0;
      transition: transform 0.2s;
      font-style: normal;
    }
    details[open] .summary-arrow { transform: rotate(90deg); }

    .summary-name {
      font-size: 16px;
    }

    /* ── Expanded detail panel ── */
    .topic-detail {
      margin: 0 0 16px 22px;
    }

    .episode-card {
      background: var(--green-light);
      border-left: 3px solid var(--green);
      border-radius: 0 6px 6px 0;
      padding: 14px 16px;
      margin-bottom: 10px;
    }

    .ep-meta {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      font-size: 12px;
      color: var(--muted);
      margin-bottom: 4px;
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    .series-badge {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      box-sizing: border-box;
      flex: 0 0 auto;
      min-height: 20px;
      min-width: 48px;
      font-size: 10px;
      line-height: 1;
      font-weight: 700;
      letter-spacing: 0.6px;
      text-transform: uppercase;
      text-align: center;
      white-space: nowrap;
      background: var(--green);
      color: #fff;
      padding: 3px 8px;
      border-radius: 999px;
    }

    @media (max-width: 380px) {
      .ep-meta { gap: 4px; }
      .series-badge {
        max-width: 100%;
        min-width: 0;
        white-space: normal;
        overflow-wrap: anywhere;
      }
    }

    .ep-title {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      font-size: 14px;
      font-weight: 600;
      color: var(--text);
      margin-bottom: 4px;
    }

    .ep-label {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      font-size: 13px;
      color: #444;
      margin-bottom: 10px;
    }

    .watch-link {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 13px;
      font-weight: 600;
      color: var(--green);
      text-decoration: none;
      border: 1.5px solid var(--green);
      padding: 5px 12px;
      border-radius: 5px;
      transition: background 0.12s, color 0.12s;
    }
    .watch-link:hover {
      background: var(--green);
      color: #fff;
    }
    .watch-link .ts {
      font-family: ui-monospace, 'SF Mono', Menlo, monospace;
      font-size: 12px;
      opacity: 0.8;
    }

    .no-match {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      font-size: 13px;
      color: #aaa;
      font-style: italic;
      padding: 4px 0 12px;
    }

    /* ── Sort toggle ── */
    .sort-bar {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      font-size: 13px;
      color: var(--muted);
      margin-bottom: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }
    .sort-bar span { color: #ccc; }
    .sort-btn {
      background: none;
      border: none;
      padding: 0;
      font-size: 13px;
      font-family: inherit;
      cursor: pointer;
      color: var(--green);
      text-decoration: underline;
      text-underline-offset: 2px;
    }
    .sort-btn.active {
      color: var(--text);
      text-decoration: none;
      font-weight: 600;
      cursor: default;
    }

    .letter-group { scroll-margin-top: 100px; }

    @media (max-width: 560px) {
      .featured-card {
        grid-template-columns: 1fr;
        gap: 1px;
        padding: 6px 0;
      }
      .featured-article {
        white-space: normal;
      }
    }

    /* ── By-theme map ── */
    .map-view {
      display: grid;
      gap: 18px;
    }
    .map-category {
      display: grid;
      grid-template-columns: 150px minmax(0, 1fr);
      gap: 18px;
      padding: 14px 0;
      border-top: 1px solid var(--border);
    }
    .map-category:first-child { border-top: 2px solid var(--green); }
    .map-category-title {
      font-size: 18px;
      font-weight: normal;
      color: var(--green);
      line-height: 1.25;
    }
    .map-branches {
      display: grid;
      gap: 8px;
    }
    .map-branch {
      position: relative;
      border: 1px solid var(--border);
      border-radius: 6px;
      background: #fff;
      overflow: hidden;
    }
    .map-branch::before {
      content: "";
      position: absolute;
      left: -12px;
      top: 13px;
      width: 12px;
      border-top: 1px solid #cfdad2;
    }
    .map-branch-summary {
      list-style: none;
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 10px;
      cursor: pointer;
      user-select: none;
    }
    .map-branch-summary::-webkit-details-marker { display: none; }
    .map-branch-name {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      font-size: 12px;
      font-weight: 700;
      color: #36533d;
      line-height: 1.25;
      flex: 1;
      min-width: 0;
    }
    .map-branch[open] .summary-arrow { transform: rotate(90deg); }
    .map-topic-list {
      border-top: 1px solid #edf1ee;
      padding: 9px 10px 10px;
    }
    .map-topic-grid {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }
    .map-topic-card {
      display: inline-flex;
      align-items: center;
      max-width: 100%;
      padding: 4px 8px;
      border: 1px solid #cfe0d2;
      border-radius: 4px;
      background: var(--green-light);
      color: var(--green);
      text-decoration: none;
      transition: background 0.12s, border-color 0.12s, color 0.12s;
    }
    .map-topic-card:hover {
      border-color: var(--green);
      background: #dfeee3;
      color: var(--green-mid);
    }
    .map-topic-card-title {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      font-size: 12px;
      font-weight: 600;
      line-height: 1.2;
    }

    /* ── Month heading (date view) ── */
    .month-heading {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      font-size: 15px;
      font-weight: 700;
      color: var(--green);
      padding: 18px 4px 4px;
      letter-spacing: 0.5px;
    }

    /* ── By-date episode group ── */
    .ep-group {
      margin-bottom: 28px;
    }
    .ep-group-header {
      display: flex;
      align-items: baseline;
      gap: 10px;
      padding-bottom: 10px;
      border-bottom: 2px solid var(--green);
      margin-bottom: 2px;
    }
    .ep-group-title {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      font-size: 15px;
      font-weight: 600;
      color: var(--text);
      flex: 1;
      min-width: 0;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .ep-group-meta {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      font-size: 12px;
      color: var(--muted);
      white-space: nowrap;
      display: flex;
      align-items: center;
      gap: 7px;
      flex-shrink: 0;
    }

    .date-topic-row {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      padding: 10px 4px;
      border-bottom: 1px solid #f0f0f0;
      gap: 20px;
    }
    .date-topic-row:last-child { border-bottom: none; }

    .date-topic-left {
      flex: 1;
      min-width: 0;
    }

    .date-topic-name {
      font-size: 15px;
      color: var(--green);
      margin-bottom: 3px;
    }

    .date-topic-label {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      font-size: 12px;
      color: var(--muted);
      line-height: 1.45;
    }

    .ts-link {
      font-family: ui-monospace, 'SF Mono', Menlo, monospace;
      font-size: 12px;
      font-weight: 600;
      color: var(--green);
      text-decoration: none;
      border: 1.5px solid var(--green);
      padding: 3px 9px;
      border-radius: 4px;
      transition: background 0.12s, color 0.12s;
      white-space: nowrap;
    }
    .ts-link:hover { background: var(--green); color: #fff; }

    /* ── Anchor permalinks ── */
    .anchor-link {
      display: inline-flex;
      align-items: center;
      color: var(--muted);
      text-decoration: none;
      opacity: 0;
      transition: opacity 0.12s;
      flex-shrink: 0;
      padding: 0 3px;
    }
    .anchor-link svg { width: 14px; height: 14px; }
    .anchor-link:hover { color: var(--green); opacity: 1 !important; }
    .anchor-copied { color: var(--green) !important; opacity: 1 !important; transition: none; }
    details:hover > summary .anchor-link { opacity: 1; }
    .ep-group:hover .anchor-link { opacity: 1; }
    .series-card:hover .anchor-link { opacity: 1; }
    details { scroll-margin-top: 64px; }
    .ep-group { scroll-margin-top: 64px; }

    /* ── AI Overview ── */
    .ai-overview {
      font-size: 13px;
      line-height: 1.7;
      color: #444;
      margin-bottom: 12px;
    }
    .ai-overview-label {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: #c96442;
      white-space: nowrap;
      vertical-align: middle;
      margin-right: 2px;
    }
    .ai-overview-label svg { width: 13px; height: 13px; flex-shrink: 0; }

    /* ── Series card ── */
    .series-card {
      border: 1.5px solid var(--border);
      border-radius: 10px;
      margin-bottom: 28px;
      overflow: hidden;
    }
    .series-card-top {
      padding: 28px 32px 24px;
      display: flex;
      gap: 24px;
      align-items: flex-start;
    }
    .series-image {
      width: 140px;
      flex-shrink: 0;
      height: auto;
      border-radius: 6px;
      display: block;
    }
    .series-card-body {
      flex: 1;
      min-width: 0;
    }
    .series-title {
      font-size: 22px;
      font-weight: normal;
      color: var(--text);
      margin-bottom: 12px;
    }
    .series-blurb {
      font-size: 15px;
      line-height: 1.75;
      color: #333;
      margin-bottom: 20px;
    }
    .series-links {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }
    .series-link {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      font-size: 13px;
      font-weight: 500;
      color: var(--green);
      background: var(--green-light);
      border: 1.5px solid transparent;
      padding: 6px 14px;
      border-radius: 6px;
      text-decoration: none;
      transition: background 0.12s, border-color 0.12s, color 0.12s;
    }
    .series-link:hover {
      background: var(--green);
      color: #fff;
      border-color: var(--green);
    }
    .series-link svg { width: 14px; height: 14px; fill: currentColor; flex-shrink: 0; }
    .series-link svg[fill="none"] { fill: none; }
    .series-topic-section {
      border-top: 1px solid var(--border);
    }
    .series-topic-heading {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--muted);
      padding: 14px 32px 0;
    }
    .series-topic-scroll {
      max-height: 380px;
      overflow-y: auto;
      padding: 8px 32px 16px;
    }

    summary::marker { color: var(--green); font-size: 10px; }

    @media (max-width: 600px) {
      .site-header { padding: 0 10px; }
      .icon-link, .nav-sep, .ext-link { display: none; }
      .logo-text { display: none; }
      .site-logo { gap: 0; }
      .nav-link { font-size: 11px; padding: 5px 6px; }
      .featured-head, .featured-card { flex-direction: column; align-items: flex-start; gap: 1px; }
      .featured-topic { white-space: normal; }
      .map-category, .map-branch { grid-template-columns: 1fr; gap: 8px; }
      .map-branch::before { display: none; }
      .series-card-top { flex-direction: column; align-items: center; }
      .series-image { width: 160px; }
    }

    /* ── Footer ── */
    .site-footer { background: var(--green); padding: 48px 24px; text-align: center; margin-top: 80px; }
    .footer-inner { max-width: 600px; margin: 0 auto; }
    .footer-logo { display: inline-flex; align-items: center; gap: 14px; text-decoration: none; margin-bottom: 20px; }
    .footer-logo img { width: 52px; height: 52px; object-fit: contain; filter: brightness(0) invert(1); }
    .footer-logo-name {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      font-size: 18px; font-weight: 700; letter-spacing: 2.5px; color: #fff; text-transform: uppercase;
    }
    .footer-icons { display: flex; justify-content: center; gap: 6px; margin-bottom: 20px; }
    .footer-icon {
      display: flex; align-items: center; justify-content: center;
      width: 44px; height: 44px; color: rgba(255,255,255,0.7);
      border-radius: 8px; text-decoration: none; transition: color .15s, background .15s;
    }
    .footer-icon:hover { color: #fff; background: rgba(255,255,255,0.1); }
    .footer-icon svg { width: 22px; height: 22px; fill: currentColor; display: block; }
    .footer-copy { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 13px; color: rgba(255,255,255,0.5); line-height: 2; }
    .footer-block-link { color: rgba(255,255,255,0.75); text-decoration: none; }
    .footer-block-link:hover { text-decoration: underline; text-underline-offset: 2px; }
  </style>
</head>
<body>

  <header class="site-header">
    <div class="header-inner">
      <a class="site-logo" href="./"><img src="./logo.png" alt=""><span class="logo-text">PB Media Archive</span></a>
      <nav class="site-nav">
        <a class="nav-link" href="./about.html">About</a>
        <a class="nav-link" href="./ask.html">Ask PB</a>
        <a class="nav-link active" href="./topics/">Topics</a>
        <a class="nav-link" href="./programming.html">Programming</a>
        <a class="nav-link" href="./events.html">Events</a>
        <span class="nav-sep"></span>

    function fmtTime(sec) {
      sec = Math.max(0, Math.floor(sec));
      const h = Math.floor(sec / 3600), m = Math.floor((sec % 3600) / 60), s = sec % 60;
      if (h > 0) return `${h}:${String(m).padStart(2,"0")}:${String(s).padStart(2,"0")}`;
      return `${m}:${String(s).padStart(2,"0")}`;
    }
    function fmtDate(str) {
      if (!str) return "";
      return new Date(str + "T00:00:00").toLocaleDateString("en-US",
        { month: "short", day: "numeric", year: "numeric" });
    }
    function fmtCompactDate(str) {
      if (!str) return "";
      if (/^\d{4}-\d{2}-\d{2}$/.test(str)) return fmtDate(str);
      const date = new Date(str);
      return Number.isNaN(date.getTime())
        ? str
        : date.toLocaleDateString("en-US", { month: "short", day: "numeric", year: "numeric" });
    }
    function scoreForKeywords(entry, keywords) {
      const text = (entry.text || "").toLowerCase(), title = (entry.title || "").toLowerCase();
      let score = 0;
      for (const k of keywords) {
        const kk = k.toLowerCase();
        score += text.split(kk).length - 1;
        if (title.includes(kk)) score += 2;
      }
      return score;
    }
    function clusterEntries(entries, maxGapSec = 60) {
      const clusters = []; let cur = null;
      for (const e of entries) {
        if (!cur) { cur = { youtube_id: e.youtube_id, start: e.t, end: e.t, score: e._score, peak: e }; continue; }
        if (e.youtube_id === cur.youtube_id && Math.abs(e.t - cur.end) <= maxGapSec) {
          cur.end = e.t; cur.score += e._score;
          if (e._score > (cur.peak?._score ?? -1)) cur.peak = e;
        } else { clusters.push(cur); cur = { youtube_id: e.youtube_id, start: e.t, end: e.t, score: e._score, peak: e }; }
      }
      if (cur) clusters.push(cur);
      return clusters;
    }

      const arr = byVid.get(youtube_id) || [];

        if (d < bestD) { best = e; bestD = d; }
        if (e.t > t + bestD) break;
      }
      return best || null;
    }

      currentSort = mode;
      document.getElementById("btn-alpha").classList.toggle("active", mode === "alpha");
      document.getElementById("btn-map").classList.toggle("active", mode === "map");
      document.getElementById("btn-date").classList.toggle("active", mode === "date");
      document.getElementById("btn-series").classList.toggle("active", mode === "series");
      const html = mode === "alpha" ? alphaHtml : mode === "map" ? mapHtml : mode === "date" ? dateHtml : seriesHtml;
      document.getElementById("list").innerHTML = html;
      updateQuickNav(mode);
    };

      const container = branch.querySelector("[data-map-key]");
      if (container) renderMapTopicList(container.dataset.mapKey);
    }, true);

    function handleHashNav() {
      const hash = location.hash;
      if (!hash) return;
      const id = hash.slice(1);

      // Switch to the correct view based on id prefix
      if (id.startsWith("ep-") && currentSort !== "date") {
        setSort("date");
      } else if (id.startsWith("map-") && currentSort !== "map") {
        setSort("map");
      } else if (id.startsWith("series-") && currentSort !== "series") {
        setSort("series");
      } else if (id.startsWith("topic-") && !["alpha", "map"].includes(currentSort)) {
        setSort("alpha");
      }

      setTimeout(() => {
        const el = document.getElementById(id);
        if (!el) return;
        if (el.classList?.contains("map-branch")) {
          const container = el.querySelector("[data-map-key]");
          if (container) renderMapTopicList(container.dataset.mapKey);
        }
        let details = el.closest("details");
        while (details) {
          details.open = true;
          const container = details.querySelector?.(":scope > .map-topic-list[data-map-key]");
          if (container) renderMapTopicList(container.dataset.mapKey);
          details = details.parentElement?.closest("details");
        }
        el.scrollIntoView({ behavior: "smooth", block: "start" });
      }, 50);
    }

    async function main() {
      const [indexData, featuredData] = await Promise.all([
        fetch("./index.json").then(r => r.json()),
        fetch("./featured_topics.json").then(r => r.ok ? r.json() : null).catch(() => null),
      ]);
      DATA = indexData;
      FEATURED = featuredData;
      byVid = new Map();
      for (const e of DATA) {
        if (!byVid.has(e.youtube_id)) byVid.set(e.youtube_id, []);
        byVid.get(e.youtube_id).push(e);
      }
      for (const arr of byVid.values()) arr.sort((a,b) => a.t - b.t);

      topicCount = TOPIC_DEFS.length;
      alphaHtml  = buildAlphaHtml();
      mapHtml    = buildMapHtml();
      dateHtml   = buildDateHtml();
      seriesHtml = buildSeriesHtml();

      document.getElementById("list").innerHTML = alphaHtml;
      document.getElementById("sub-count").textContent = `${topicCount} topics`;
      renderFeaturedTopics();
      updateQuickNav("alpha");

      handleHashNav();
    }

    window.addEventListener("hashchange", handleHashNav);

    document.addEventListener("click", function(e) {
      const link = e.target.closest(".anchor-link");
      if (!link) return;
      const url = new URL(link.getAttribute("href"), document.baseURI).href;
      navigator.clipboard.writeText(url).catch(() => {});
      link.classList.add("anchor-copied");
      setTimeout(() => link.classList.remove("anchor-copied"), 1500);
    });

    main();
  </script>
